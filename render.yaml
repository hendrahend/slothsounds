# Sloth Sounds — Render Blueprint
# Hosts the public demo site (pre-generated loops + the latest night set).
# Generation itself stays local (MusicGen needs a GPU); this deploy is the
# shop window judges and visitors can hear.

services:
  # Static demo site: player + library of generated loops.
  - type: web
    name: slothsounds-site
    runtime: static
    rootDir: site
    buildCommand: echo "static site, no build"
    staticPublishPath: .
    autoDeployTrigger: commit
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
